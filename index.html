<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aronsz26 Repo</title>
<link rel="icon" href="CydiaIcon.png">
<style>
  :root { --bg: #16092c; --card: rgba(255,255,255,0.07); --text: #f3ecfa; --muted: #c9b8dc; --accent: #8e44c8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: linear-gradient(160deg, #16092c 0%, #3b1a63 55%, #7a2f77 100%);
         color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 56px 20px 40px; }
  header { text-align: center; }
  header img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  h1 { margin: 18px 0 4px; font-size: 30px; }
  .url { color: var(--muted); font-size: 15px; word-break: break-all; }
  .buttons { display: flex; gap: 12px; justify-content: center; margin: 26px 0 36px; flex-wrap: wrap; }
  .buttons a { flex: 1 1 200px; max-width: 240px; text-align: center; padding: 13px 18px; border-radius: 14px;
               background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  .buttons a.secondary { background: var(--card); border: 1px solid rgba(255,255,255,0.18); }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
  .tweak { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: var(--card);
           color: inherit; text-decoration: none; }
  .tweak img { width: 56px; height: 56px; border-radius: 13px; flex: none; }
  .tweak strong { display: block; }
  .tweak span { color: var(--muted); font-size: 15px; }
  footer { margin-top: 36px; text-align: center; color: var(--muted); font-size: 14px; }
  footer a { color: var(--text); }
</style>
</head>
<body>
<main>
  <header>
    <img src="CydiaIcon.png" alt="">
    <h1>aronsz26 Repo</h1>
    <div class="url">https://aronsz26.github.io/</div>
  </header>

  <div class="buttons">
    <a href="sileo://source/https://aronsz26.github.io/">Add to Sileo</a>
    <a class="secondary" href="zbra://sources/add/https://aronsz26.github.io/">Add to Zebra</a>
  </div>

  <h2>Tweaks</h2>
  <a class="tweak" href="https://github.com/aronsz26/LockScreenRestore">
    <img src="https://raw.githubusercontent.com/aronsz26/LockScreenRestore/main/depiction/icon.png" alt="">
    <div>
      <strong>LockScreenRestore</strong>
      <span>The iOS 15 lock screen, back on iOS 16. Rootless.</span>
    </div>
  </a>

  <footer>
    Problems or ideas? <a href="https://github.com/aronsz26/LockScreenRestore/issues">Open an issue on GitHub</a>
  </footer>
</main>
</body>
</html>
